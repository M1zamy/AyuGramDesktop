name: Build AyuGram Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - dev*
      - main*
      - master
    tags:
      - 'v*'

jobs:
  windows:
    name: Build Windows x64 Release
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Free up disk space on C drive
        shell: pwsh
        run: |
          Write-Host "Free space before cleanup:"
          Get-PSDrive C | Select-Object Used,Free
          $pathsToRemove = @(
            "C:\Android",
            "C:\Program Files\Android",
            "C:\vcpkg",
            "C:\Selenium",
            "C:\Program Files\Microsoft SDKs\Azure",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\Go",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk",
            "C:\hostedtoolcache\windows\PyPy"
          )
          foreach ($p in $pathsToRemove) {
            if (Test-Path $p) {
              Write-Host "Removing $p..."
              Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Free space after cleanup:"
          Get-PSDrive C | Select-Object Used,Free

      - name: Prepare build directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'

      - name: Fix ATLMFC include path for Breakpad GYP
        run: |
          if exist "%VCToolsInstallDir%atlmfc" (
            if not exist "%VCINSTALLDIR%atlmfc" mklink /j "%VCINSTALLDIR%atlmfc" "%VCToolsInstallDir%atlmfc"
          )
          if exist "%VCToolsInstallDir%ATLMFC" (
            if not exist "%VCINSTALLDIR%atlmfc" mklink /j "%VCINSTALLDIR%atlmfc" "%VCToolsInstallDir%ATLMFC"
          )

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup CMake and Ninja
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Restore ThirdParty Cache
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-third-party-${{ hashFiles('**/prepare.py') }}
          restore-keys: |
            ${{ runner.os }}-x64-third-party-

      - name: Restore Libraries Cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.os }}-x64-libs-${{ hashFiles('**/prepare.py') }}
          restore-keys: |
            ${{ runner.os }}-x64-libs-

      - name: Build Third-Party Dependencies
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          call %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6

      - name: Free up disk space and optimize cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          find "${LibrariesPath//\\//}" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete || true

      - name: Save ThirdParty Cache
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-third-party-${{ hashFiles('**/prepare.py') }}

      - name: Save Libraries Cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.os }}-x64-libs-${{ hashFiles('**/prepare.py') }}

      - name: Configure CMake
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat -G "Ninja Multi-Config" qt6 ^
            -DTDESKTOP_API_ID=2040 ^
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -DCMAKE_CONFIGURATION_TYPES=Release ^
            -DDESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -DDESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Build AyuGram
        run: |
          cmake --build %TBUILD%\%REPO_NAME%\out --config Release --parallel

      - name: Package Artifacts
        run: |
          mkdir "%GITHUB_WORKSPACE%\dist"
          for /r "%TBUILD%\%REPO_NAME%\out" %%f in (*AyuGram*.exe *Telegram*.exe *Updater*.exe) do (
            echo Found binary: %%f
            copy /y "%%f" "%GITHUB_WORKSPACE%\dist\"
          )
          for /r "%TBUILD%\%REPO_NAME%\out" %%f in (*.dll) do (
            echo Found library: %%f
            copy /y "%%f" "%GITHUB_WORKSPACE%\dist\"
          )
          if exist "%GITHUB_WORKSPACE%\dist\Telegram.exe" (
            if not exist "%GITHUB_WORKSPACE%\dist\AyuGram.exe" copy /y "%GITHUB_WORKSPACE%\dist\Telegram.exe" "%GITHUB_WORKSPACE%\dist\AyuGram.exe"
          )
          dir "%GITHUB_WORKSPACE%\dist"
          if not exist "%GITHUB_WORKSPACE%\dist\AyuGram.exe" (
            echo [ERROR] AyuGram.exe was not found in dist!
            exit /b 1
          )

      - name: Upload AyuGram Binary
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-v7.2.9-Windows-x64
          path: dist\
          retention-days: 14
